<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content: en navegadores que lo soportan
         (Chrome/Android), el teclado encoge el viewport visual en vez de
         taparlo por encima — sin esto, el panel flotante del coach (fijo
         al viewport) puede quedar parcialmente oculto detrás del teclado. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="description" content="KROTON HABITOS — registra tus hábitos día a día y visualiza tu progreso." />
    <link rel="icon" type="image/png" href="/favicon-kroton.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <title>KROTON — APLICACIÓN PREMIUM</title>
  </head>
  <body>
    <div id="app"></div>
    <div class="divider"></div>

    <section class="shop-carousel">
      <h2 class="shop-carousel__title">Tienda Kroton</h2>
      <div class="shop-carousel__wrap">
        <button class="shop-carousel__nav shop-carousel__nav--prev" type="button" aria-label="Anterior">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="shop-carousel__track" id="shopCarouselTrack">
          <a class="shop-carousel__item" href="https://krotonoficial.com/" target="_blank" rel="noopener">
            <img src="/tienda/Gorra_Diagonal_Oficial.jpg" alt="Tienda Kroton" loading="lazy" />
          </a>
          <a class="shop-carousel__item" href="https://krotonoficial.com/" target="_blank" rel="noopener">
            <img src="/tienda/Oficial_foto_delantera.jpg" alt="Tienda Kroton" loading="lazy" />
          </a>
          <a class="shop-carousel__item" href="https://krotonoficial.com/" target="_blank" rel="noopener">
            <img src="/tienda/Oficial_foto_camisilla_delante.jpg" alt="Tienda Kroton" loading="lazy" />
          </a>
          <a class="shop-carousel__item" href="https://krotonoficial.com/" target="_blank" rel="noopener">
            <img src="/tienda/Oficial_front_camisilla_sin_mangas_clasica.jpg" alt="Tienda Kroton" loading="lazy" />
          </a>
        </div>
        <button class="shop-carousel__nav shop-carousel__nav--next" type="button" aria-label="Siguiente">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>
      <a class="shop-carousel__cta" href="https://krotonoficial.com/" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        <span>Ir a la tienda</span>
      </a>
    </section>

    <footer class="site-footer">
      <div class="footer-logo"><img src="/logo-kroton-naranja.png" alt="Kroton" /></div>
      <strong class="footer-brand">KROTON OFICIAL · APLICACIÓN PREMIUM</strong>
    </footer>

    <!-- CAPTCHA del registro (Cloudflare Turnstile). render=explicit + onload
         para controlar nosotros cuándo y dónde se pinta el widget, en vez de
         que se monte solo en cualquier div con la clase por defecto. -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstileLoad&render=explicit" defer></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
